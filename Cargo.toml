[package]
name = "r5rust-launcher"
version = "0.4.0"
edition = "2024"

[dependencies]
eframe = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
toml_edit = "0.25"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
raw-window-handle = "0.6"
# player mode: builds + updates from GitHub Releases
ureq = "2"
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Discord Rich Presence (local IPC to the Discord app)
discord-rich-presence = "1.1"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
