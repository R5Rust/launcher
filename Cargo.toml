[package]
name = "r5rust-launcher"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
toml_edit = "0.25"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp"] }
